aid: insify
name: Insify
description: 'Insify is a Dutch insurtech offering fully digital business insurance for freelancers,
  self-employed professionals (ZZP''ers) and small-to-medium enterprises in the Netherlands. Its
  online-first product line covers disability/income protection (arbeidsongeschiktheid, AOV),
  professional liability (beroepsaansprakelijkheid, BAV), business liability (bedrijfsaansprakelijkheid,
  AVB), business inventory and goods, electronics, in-vehicle equipment and auto cover, sold and
  managed entirely online with no setup, advisory or cancellation fees and daily cancellation.
  Serving more than 40,000 entrepreneurs across professions from IT and photography to care and
  construction, Insify pairs instant quoting and fast claims with AI-assisted guidance (SmartGuide).
  Backed by Accel, the company is tracked in the API Evangelist network as an insurance-tech
  provider profile; it is a consumer-facing insurer and does not currently publish a public
  developer API surface.'
